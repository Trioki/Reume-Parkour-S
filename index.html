<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GMod Loading Screen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-overlay">
    <img src="img/picture.jpg" alt="Background">
		</div>
    <div class="loading-container">
        <h1 id="server-name">Загрузка сервера...</h1>
        <h3 id="map-name">Карта: определение...</h3>
        
        <div class="spinner"></div>
        
        <div id="loading-status">Установление соединения...</div>
    </div>

    <script>
        // Функция автоматически вызывается игрой при подключении
        function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
            document.getElementById('server-name').innerText = servername;
            document.getElementById('map-name').innerText = "Карта: " + mapname;
        }

        // Функция автоматически обновляет статус (например: "Скачивание файлов...")
        function SetStatusChanged(status) {
            document.getElementById('loading-status').innerText = status;
        }
    </script>
</body>
</html>
